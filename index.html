<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Lucky Draft 2026</title>
<style>
:root{--red:#e10600;--panel:#14141a;--line:#2a2a33;--txt:#f4f4f6;--mut:#9a9aa6;--gold:#f5c542}
*{box-sizing:border-box;margin:0}
body{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;color:var(--txt);min-height:100vh;
background:repeating-linear-gradient(45deg,#0c0c0f 0 3px,#121216 3px 6px),#0a0a0c;background-attachment:fixed}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:3px solid var(--red);background:#000c}
h1{font-size:28px;font-style:italic;font-weight:900;letter-spacing:-1px}
h1 b{color:var(--red)}
.btn{background:none;border:1px solid var(--line);color:var(--txt);padding:10px 20px;font:700 14px inherit;font-family:inherit;cursor:pointer;transform:skewX(-10deg)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.big{font-size:22px;padding:16px 44px}
.btn:hover{border-color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:20px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px}
.slot{border:1px dashed var(--line);padding:8px 10px;min-height:54px;font-size:13px;background:#0008}
.slot small{display:block;color:var(--mut);font-size:11px}
.slot.full{border:1px solid var(--red)}
.center{text-align:center;padding:30px 0}
.reel{margin:18px auto;max-width:560px;padding:22px;border:2px solid var(--c,#333);background:#000b;font-size:44px;font-weight:900;font-style:italic;color:var(--c,#fff);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(160deg,#1c1c24,#101015);border:1px solid var(--line);border-left:6px solid var(--c);padding:14px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.card.pick{cursor:pointer;transition:transform .12s}
.card.pick:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--red)}
.ovr{font-size:46px;font-weight:900;font-style:italic;line-height:1;color:var(--gold)}
.role{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.nm{font-size:19px;font-weight:800;margin-top:8px;line-height:1.1}
.sub{color:var(--mut);font-size:13px;margin:3px 0 8px}
.st{display:grid;grid-template-columns:70px 1fr 24px;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-top:4px}
.st i{height:5px;background:#2a2a33;display:block}
.st i s{display:block;height:100%;background:var(--red)}
.st span:last-child{color:var(--txt);text-align:right}
.panel{background:#000a;border:1px solid var(--line);padding:20px;margin-bottom:18px;overflow-x:auto}
.power{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pw{font-size:80px;font-weight:900;font-style:italic;color:var(--red);line-height:1}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;font-size:13px;color:var(--mut);flex:1}
.parts b{display:block;color:var(--txt);font-size:15px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px}
tr.me{background:#e1060033;font-weight:800}
tr.dnf td{color:#666}
h2{margin-bottom:10px}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;background:var(--c)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;align-items:end}
.pod{padding:18px;background:#000a;border:1px solid var(--line);border-top:5px solid var(--c);text-align:center}
.pod .big{font-size:56px;font-weight:900;font-style:italic;line-height:1}
.pod.p1{padding:30px 18px;border-top-color:var(--gold)}.pod.p1 .big{color:var(--gold);font-size:76px}
#celeb{position:fixed;inset:0;pointer-events:none;z-index:60;transition:opacity 1s}
#celeb canvas{position:absolute;inset:0}
#celeb .car{position:absolute;left:0;top:0;will-change:transform}
.cbanner{position:absolute;top:14%;left:0;right:0;text-align:center;font:900 italic clamp(32px,7vw,72px) "Arial Narrow",Arial,sans-serif;color:var(--gold);text-shadow:0 4px 24px #000;animation:cb 6s forwards}
@keyframes cb{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
details.panel>summary{cursor:pointer;font-size:20px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.panel>summary::after{content:"Show ▾";font-size:13px;color:var(--red)}
details.panel[open]>summary::after{content:"Hide ▴"}
details.panel[open]>summary{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.slots{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pw{font-size:60px}.reel{font-size:30px}}
</style>
</head>
<body>

<script>
// ---------- DATA ----------
const COL={"Red Bull":"#3671c6","McLaren":"#ff8000","Ferrari":"#e8002d","Mercedes":"#27f4d2","Aston Martin":"#229971","Racing Bulls":"#6692ff","Haas":"#b6babd","Alpine":"#ff87bc","Williams":"#64c4ff","Audi":"#c0392b","Cadillac":"#d4af37","Your Team":"#e10600",
"1988 McLaren":"#e8e8e8","2023 Red Bull":"#1e41ff","2016 Mercedes":"#00d2be","2004 Ferrari":"#dc0000","1992 Williams":"#0a4ea3","2009 Brawn GP":"#d9f21a","2010 Red Bull":"#2d4fb3","2012 Lotus":"#c9a227","1976 Ferrari":"#c8102e",
"1996 Williams":"#2a6fd1","1998 McLaren":"#9aa0a6","2005 Renault":"#ffd800","2019 Haas":"#c9ccd1","2014 Caterham":"#0b8a4a","2009 Toyota":"#f5f5f5","2002 Minardi":"#e6c300","1990 Tyrrell":"#3a78d8","2008 Honda":"#c0c0c8","2018 Williams":"#4aa3ff","2012 HRT":"#c0392b","2007 Super Aguri":"#e5483a"};
// name, team, overall, pace, racecraft, consistency, wet
const DR=[
["Max Verstappen","Red Bull",96,97,95,93,97],["Isack Hadjar","Red Bull",78,79,76,72,74],
["Lando Norris","McLaren",94,95,91,92,88],["Oscar Piastri","McLaren",92,92,90,93,86],
["Charles Leclerc","Ferrari",92,96,88,85,89],["Lewis Hamilton","Ferrari",90,88,93,89,95],
["George Russell","Mercedes",93,93,90,92,90],["Kimi Antonelli","Mercedes",91,93,86,82,87],
["Fernando Alonso","Aston Martin",86,84,94,86,92],["Lance Stroll","Aston Martin",72,70,71,69,76],
["Liam Lawson","Racing Bulls",78,78,80,74,75],["Arvid Lindblad","Racing Bulls",70,74,66,62,68],
["Oliver Bearman","Haas",82,82,81,78,80],["Esteban Ocon","Haas",79,77,80,80,81],
["Pierre Gasly","Alpine",82,80,83,84,82],["Franco Colapinto","Alpine",74,75,72,68,73],

["Nico Hülkenberg","Audi",80,78,82,85,83],["Gabriel Bortoleto","Audi",76,78,74,70,72],
["Sergio Pérez","Cadillac",76,73,78,72,74],["Valtteri Bottas","Cadillac",75,74,73,79,77]

["Andrea Stella","McLaren",91,"Calm strategist"],["Frédéric Vasseur","Ferrari",88,"Driver whisperer"],
["Laurent Mekies","Red Bull",86,"Technical operator"],["Flavio Briatore","Alpine",82,"Ruthless dealmaker"],
["James Vowles","Williams",80,"Process rebuilder"],["Ayao Komatsu","Haas",79,"Lean, efficient leader"],

const CR=[["Mercedes W17","Mercedes",95],["McLaren MCL40","McLaren",92],["Ferrari SF-26","Ferrari",91],
["Red Bull RB22","Red Bull",89],["Aston Martin AMR26","Aston Martin",82],["Williams FW48","Williams",80],
["Alpine A526","Alpine",77],["Haas VF-26","Haas",76],["Audi R26","Audi",76],
["Racing Bulls VCARB 03","Racing Bulls",75],["Cadillac MAC-26","Cadillac",72]];
const EN=[["Marco Valdivia","Mercedes",92,"Race engineer"],["Hannah Reisner","McLaren",90,"Performance engineer"],
["Tomás Okafor","Ferrari",88,"Race engineer"],["Sven Lindqvist","Red Bull",86,"Strategy engineer"],
["Priya Raman","Aston Martin",84,"Performance engineer"],["Giulio Ferrante","Williams",81,"Race engineer"],
["Callum Whitaker","Alpine",79,"Race engineer"],["Yuki Aizawa","Haas",77,"Performance engineer"],
["Elena Marchetti","Audi",76,"Strategy engineer"],["Dario Quintero","Racing Bulls",74,"Race engineer"],
["Naomi Frost","Cadillac",70,"Junior race engineer"]];
const CAL=["Australia","China","Japan","Bahrain","Saudi Arabia","Miami","Canada","Monaco","Barcelona","Austria","Britain","Belgium","Hungary","Netherlands","Italy","Madrid","Azerbaijan","Singapore","United States","Mexico","Brazil","Las Vegas","Qatar","Abu Dhabi"];
const ITEMS=[
 ...DR.map(d=>({id:"d"+d[0],role:"driver",name:d[0],team:d[1],ovr:d[2],sub:d[1],stats:{Pace:d[3],Racecraft:d[4],Consistency:d[5],"Wet skill":d[6]}})),
 ...TP.map(p=>({id:"p"+p[0],role:"principal",name:p[0],team:p[1],ovr:p[2],sub:p[1]+" · "+p[3]})),
 ...CR.map(c=>({id:"c"+c[0],role:"car",name:c[0],team:c[1],ovr:c[2],sub:c[1]+" chassis"})),
 ...EN.map(e=>({id:"e"+e[0],role:"engineer",name:e[0],team:e[1],ovr:e[2],sub:e[3]+" · "+e[1]}))
];
// historic: t=team, p=principal, c=car, e=engineer, d=[name,overall,pace,racecraft,consistency,wet]
const HIST=[
{t:"1988 McLaren",p:["Ron Dennis",94,"Master of the machine"],c:["MP4/4",98],e:["Steve Nichols",91,"Chief designer"],d:[["Ayrton Senna ’88",97,99,95,90,99],["Alain Prost ’88",96,94,99,97,92]]},
{t:"2023 Red Bull",p:["Christian Horner",90,"Title-winning operator"],c:["RB19",97],e:["Gianpiero Lambiase",90,"Race engineer"],d:[["Max Verstappen ’23",98,98,97,98,97],["Sergio Pérez ’23",80,78,80,70,72]]},
{t:"2016 Mercedes",p:["Toto Wolff",93,"Dynasty builder"],c:["F1 W07 Hybrid",96],e:["Peter Bonnington",90,"Race engineer"],d:[["Lewis Hamilton ’16",95,96,94,90,96],["Nico Rosberg ’16",91,90,88,92,84]]},
{t:"2004 Ferrari",p:["Jean Todt",92,"Iron-fisted architect"],c:["F2004",96],e:["Rory Byrne",93,"Chief designer"],d:[["Michael Schumacher ’04",96,95,96,97,92],["Rubens Barrichello ’04",85,84,82,86,82]]},
{t:"1992 Williams",p:["Frank Williams",88,"Racer’s team boss"],c:["FW14B",98],e:["Adrian Newey",95,"Chief designer"],d:[["Nigel Mansell ’92",93,96,92,86,92],["Riccardo Patrese ’92",86,85,84,84,80]]},
{t:"2009 Brawn GP",p:["Ross Brawn",93,"Strategic mastermind"],c:["BGP 001",92],e:["Jörg Zander",84,"Technical director"],d:[["Jenson Button ’09",90,89,90,92,86],["Rubens Barrichello ’09",86,86,85,85,82]]},
{t:"2010 Red Bull",p:["Christian Horner",88,"Title-winning operator"],c:["RB6",96],e:["Rob Marshall",88,"Chief designer"],d:[["Sebastian Vettel ’10",94,96,92,88,90],["Mark Webber ’10",88,88,85,86,85]]},
{t:"2012 Lotus",p:["Eric Boullier",78,"Pragmatic team boss"],c:["E20",82],e:["James Allison",85,"Technical director"],d:[["Kimi Räikkönen ’12",88,88,86,90,84],["Romain Grosjean ’12",80,84,76,68,78]]},
{t:"1976 Ferrari",p:["Enzo Ferrari",88,"Il Commendatore"],c:["312T2",90],e:["Mauro Forghieri",90,"Chief designer"],d:[["Niki Lauda ’76",93,90,95,95,92],["Clay Regazzoni ’76",82,82,80,78,78]]}
,
{t:"1996 Williams",p:["Frank Williams",88,"Racer’s team boss"],c:["FW18",96],e:["Patrick Head",91,"Technical director"],d:[["Damon Hill ’96",91,90,88,92,90],["Jacques Villeneuve ’96",90,92,90,86,84]]},
{t:"1998 McLaren",p:["Ron Dennis",94,"Master of the machine"],c:["MP4-13",95],e:["Adrian Newey",95,"Chief designer"],d:[["Mika Häkkinen ’98",93,94,92,92,90],["David Coulthard ’98",86,84,84,86,84]]},
{t:"2005 Renault",p:["Flavio Briatore",85,"Ruthless dealmaker"],c:["R25",90],e:["Pat Symonds",88,"Engineering chief"],d:[["Fernando Alonso ’05",94,92,95,94,92],["Giancarlo Fisichella ’05",85,86,82,80,82]]},
{t:"2009 Toyota",p:["Tadashi Yamashina",68,"Corporate team president"],c:["TF109",82],e:["Pascal Vasselon",80,"Technical coordinator"],d:[["Jarno Trulli ’09",83,85,80,80,72],["Timo Glock ’09",80,80,78,80,84]]},
{t:"1990 Tyrrell",p:["Ken Tyrrell",76,"Old-school patriarch"],c:["Tyrrell 019",80],e:["Harvey Postlethwaite",86,"Chief designer"],d:[["Jean Alesi ’90",85,86,86,78,84],["Satoru Nakajima ’90",70,68,68,72,66]]},
{t:"2008 Honda",p:["Ross Brawn",88,"Strategic mastermind"],c:["RA108",50],e:["Jörg Zander",70,"Technical director"],d:[["Jenson Button ’08",80,80,80,82,84],["Rubens Barrichello ’08",78,76,76,80,82]]},
{t:"2019 Haas",p:["Günther Steiner",72,"Blunt straight-talker"],c:["VF-19",62],e:["Ayao Komatsu",74,"Chief race engineer"],d:[["Romain Grosjean ’19",74,78,70,62,70],["Kevin Magnussen ’19",76,76,76,72,74]]},
{t:"2018 Williams",p:["Claire Williams",58,"Heir under pressure"],c:["FW41",52],e:["Paddy Lowe",72,"Technical chief"],d:[["Lance Stroll ’18",66,64,66,68,70],["Sergey Sirotkin ’18",60,62,58,60,58]]},
{t:"2007 Super Aguri",p:["Aguri Suzuki",56,"Ex-driver turned boss"],c:["SA07",48],e:["Mark Preston",60,"Technical director"],d:[["Takuma Satō ’07",76,78,80,66,72],["Anthony Davidson ’07",72,72,72,72,70]]},
{t:"2014 Caterham",p:["Cyril Abiteboul",58,"Fighting for survival"],c:["CT05",42],e:["Mark Smith",60,"Technical director"],d:[["Kamui Kobayashi ’14",72,74,75,68,70],["Marcus Ericsson ’14",62,62,60,64,62]]},
{t:"2002 Minardi",p:["Paul Stoddart",60,"Plucky privateer"],c:["PS02",40],e:["Gabriele Tredozi",62,"Technical director"],d:[["Mark Webber ’02",78,80,80,74,76],["Alex Yoong ’02",52,52,50,55,52]]},
{t:"2012 HRT",p:["Luis Pérez-Sala",52,"Spanish minnow boss"],c:["F112",36],e:["Toni Cuquerella",58,"Technical director"],d:[["Pedro de la Rosa ’12",68,66,68,72,70],["Narain Karthikeyan ’12",54,54,52,56,54]]}
];
HIST.forEach(h=>{const t=h.t,x="@"+t;
 h.d.forEach(d=>ITEMS.push({id:"d"+d[0]+x,role:"driver",era:1,name:d[0],team:t,ovr:d[1],sub:t,stats:{Pace:d[2],Racecraft:d[3],Consistency:d[4],"Wet skill":d[5]}}));
 ITEMS.push({id:"p"+h.p[0]+x,role:"principal",era:1,name:h.p[0],team:t,ovr:h.p[1],sub:t+" · "+h.p[2]},
  {id:"c"+h.c[0]+x,role:"car",era:1,name:h.c[0],team:t,ovr:h.c[1],sub:t+" chassis"},
  {id:"e"+h.e[0]+x,role:"engineer",era:1,name:h.e[0],team:t,ovr:h.e[1],sub:h.e[2]+" · "+t});
});
const MODES={modern:["Modern 2026","Only the 2026 teams appear in the draw."],mixed:["Legends mix","2026 teams and historic teams, from champions to backmarkers, share the draw."],historic:["Historic only","Only past teams appear in the draw, from title winners to backmarkers."]};
const LIMIT={driver:2,principal:1,car:1,engineer:1};
const LABEL={driver:"Driver",principal:"Team principal",car:"Car",engineer:"Engineer"};
const PTS=[25,18,15,12,10,8,6,4,2,1],REPLACE=68;

// ---------- STATE ----------
let view="draft",sel=[],offer=null,refreshes=2,mode="modern",spinning=false,season=null,lastRace=null;
const $=s=>document.querySelector(s);
const byId=id=>ITEMS.find(i=>i.id===id);
const picks=r=>sel.map(byId).filter(i=>i.role===r);
const complete=()=>Object.keys(LIMIT).every(r=>picks(r).length===LIMIT[r]);
const inMode=i=>mode==="mixed"||(mode==="historic")===!!i.era;
const eligible=()=>ITEMS.filter(i=>inMode(i)&&!sel.includes(i.id)&&picks(i.role).length<LIMIT[i.role]);
const dot=t=>`<span class="dot" style="--c:${COL[t]}"></span>`;

function card(i,pick){
  const st=i.stats?Object.entries(i.stats).map(([k,v])=>`<div class="st"><span>${k}</span><i><s style="width:${v}%"></s></i><span>${v}</span></div>`).join(""):"";
  return `<div class="card ${pick?"pick":""}" style="--c:${COL[i.team]}" ${pick?`data-id="${i.id}"`:""}>
   <div style="display:flex;justify-content:space-between"><div class="ovr">${i.ovr}</div><div class="role">${i.era?"Classic · ":""}${LABEL[i.role]}</div></div>
   <div class="nm">${i.name}</div><div class="sub">${i.sub}</div>${st}</div>`;
}

// ---------- DRAFT ----------
function draw(refresh){
  if(spinning||(refresh&&refreshes<1))return;
  let teams=[...new Set(eligible().map(i=>i.team))];
  if(refresh){refreshes--;if(teams.length>1)teams=teams.filter(t=>t!==offer)}
  const final=teams[Math.floor(Math.random()*teams.length)];
  spinning=true;offer=null;render();
  const reel=$("#reel"),all=[...new Set(eligible().map(i=>i.team))];let n=0;
  const iv=setInterval(()=>{
    const t=++n>16?final:all[Math.floor(Math.random()*all.length)];
    reel.textContent=t;reel.style.setProperty("--c",COL[t]);
    if(n>16){clearInterval(iv);spinning=false;offer=final;setTimeout(render,350)}
  },85+n*6);
}
function pickItem(id){sel.push(id);offer=null;render()}
function renderDraft(){
  const slots=Object.keys(LIMIT).flatMap(r=>Array.from({length:LIMIT[r]},(_,n)=>{const it=picks(r)[n];
    return `<div class="slot ${it?"full":""}"><small>${LABEL[r]}${LIMIT[r]>1?" "+(n+1):""}</small>${it?`${dot(it.team)}<b>${it.name}</b> · ${it.ovr}`:"Empty"}</div>`}));
  let body="";
  if(complete()) body=`<div class="center"><h2>Squad complete</h2><button class="btn red big" id="build">Start the 24-race season</button></div>`;
  else if(spinning) body=`<div class="center"><div class="role">Drawing a team…</div><div class="reel" id="reel">?</div></div>`;
  else if(offer){
    const items=eligible().filter(i=>i.team===offer);
    body=`<div class="center" style="padding-bottom:10px"><div class="role">You drew</div><div class="reel" style="--c:${COL[offer]};font-size:36px;padding:12px">${offer}</div><p style="color:var(--mut);margin-bottom:12px">Pick one of their available pieces, or refresh for a different team.</p><button class="btn" id="refresh" ${refreshes?"":"disabled"}>Refresh team (${refreshes} left)</button></div>
      <div class="grid">${items.map(i=>card(i,true)).join("")}</div>`;
  } else body=`<div class="center"><h2>Pick ${sel.length+1} of 5</h2><p style="color:var(--mut);margin-bottom:20px">Draw a random team, then take one of its drivers, its car, its principal or its engineer.</p>${sel.length===0?`<div class="bar" style="justify-content:center">${Object.entries(MODES).map(([k,m])=>`<button class="btn ${mode===k?"red":""}" data-mode="${k}">${m[0]}</button>`).join("")}</div><p style="color:var(--mut);margin-bottom:20px">${MODES[mode][1]}</p>`:""}<button class="btn red big" id="draw">Draw a team</button></div>`;
  $("#app").innerHTML=`<div class="slots">${slots.join("")}</div>${body}`;
  document.querySelectorAll(".card.pick").forEach(c=>c.onclick=()=>pickItem(c.dataset.id));
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
  if($("#draw"))$("#draw").onclick=()=>draw(false);
  if($("#refresh"))$("#refresh").onclick=()=>draw(true);
  if($("#build"))$("#build").onclick=startSeason;
}

// ---------- SEASON ----------
function power(){
  const d=picks("driver"),avg=(d[0].ovr+d[1].ovr)/2,p=picks("principal")[0].ovr,c=picks("car")[0].ovr,e=picks("engineer")[0].ovr;
  return {avg,p,c,e,total:Math.round(avg*.4+c*.3+p*.15+e*.15)};
}
function startSeason(){
  const mine=picks("driver"),mineIds=mine.map(d=>d.id),taken=sel.map(byId);
  const mc=picks("car")[0].ovr,mp=picks("principal")[0].ovr,me=picks("engineer")[0].ovr;
  const own=(arr,team,role)=>taken.some(t=>t.role===role&&t.team===team)?REPLACE:arr.find(x=>x[1]===team)[2];
  const ex={pts:0,wins:0,pod:0,dnf:0,best:99,fin:[]};
  const drivers=[
    ...DR.filter(d=>!mineIds.includes("d"+d[0])).map(d=>({name:d[0],team:d[1],me:false,ovr:d[2],pace:d[3],race:d[4],cons:d[5],wet:d[6],
      car:own(CR,d[1],"car"),pr:own(TP,d[1],"principal"),en:own(EN,d[1],"engineer"),...ex,fin:[]})),
    ...mine.map(it=>({name:it.name,team:"Your Team",me:true,ovr:it.ovr,pace:it.stats.Pace,race:it.stats.Racecraft,cons:it.stats.Consistency,wet:it.stats["Wet skill"],
      car:mc,pr:mp,en:me,...ex,fin:[]}))
  ];
  season={race:0,drivers,teams:{},winners:[],lead:[...picks("driver")].sort((a,b)=>b.ovr-a.ovr)[0].name};
  lastRace=null;view="team";render();
}
const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return (u-3)/Math.sqrt(.5)};
function runRace(){
  const wet=Math.random()<.25,name=CAL[season.race];
  const grid=season.drivers.map(d=>{
    let skill=(d.ovr*2+d.pace+d.race)/4;if(wet)skill=skill*.6+d.wet*.4;
    const base=skill*.45+d.car*.3+d.pr*.125+d.en*.125;
    const dnf=Math.random()<.03+(100-d.cons)/1000;
    const num=d.me?(d.name===season.lead?2:-1.5):0;
    return {d,dnf,score:base+num+gauss()*(2+(100-d.cons)*.25)};
  }).sort((a,b)=>(a.dnf-b.dnf)||(b.score-a.score));
  grid.forEach((g,i)=>{
    const d=g.d,p=g.dnf?0:(PTS[i]||0);g.pos=i+1;g.pts=p;d.pts+=p;
    season.teams[d.team]=(season.teams[d.team]||0)+p;
    if(g.dnf){d.dnf++}else{d.fin.push(i+1);d.best=Math.min(d.best,i+1);if(i===0)d.wins++;if(i<3)d.pod++}
  });
  season.winners.push({name,wet,win:grid[0].d});
  season.race++;lastRace={name,wet,grid,n:season.race};
}
const ranked=()=>[...season.drivers].sort((a,b)=>b.pts-a.pts||b.wins-a.wins||b.pod-a.pod||a.best-b.best);

function renderTeam(){
  const P=power(),all=Object.keys(LIMIT).flatMap(r=>picks(r)),done=season.race>=24;
  const next=done?"":CAL[season.race];
  const rk=ranked();
  $("#app").innerHTML=`
  <div class="panel power"><div><div class="role">Team power</div><div class="pw">${P.total}</div></div>
   <div class="parts"><div>Drivers (40%)<b>${P.avg.toFixed(1)} avg</b></div><div>Car (30%)<b>${P.c}</b></div><div>Principal (15%)<b>${P.p}</b></div><div>Engineer (15%)<b>${P.e}</b></div></div></div>
  <div class="grid" style="margin-bottom:18px">${all.map(i=>card(i)).join("")}</div>
  <div class="panel"><h2>Driver line-up</h2>
   <p style="color:var(--mut);margin-bottom:12px">Your #1 driver gets team priority (+2 performance); your #2 takes a −1.5 hit. ${season.race===0?"You can swap until the first race starts.":"Locked after the first race."}</p>
   ${[...picks("driver")].sort((x,y)=>(y.name===season.lead)-(x.name===season.lead)).map(d=>{const one=d.name===season.lead;return `<div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><b style="font-size:26px;color:${one?"var(--gold)":"var(--mut)"};width:44px;font-style:italic">#${one?1:2}</b><span style="flex:1">${dot(d.team)}<b>${d.name}</b> · ${d.ovr}</span>${!one&&season.race===0?`<button class="btn" data-lead="${d.name}">Make #1</button>`:""}</div>`}).join("")}</div>
  <div class="bar"><button class="btn red" id="next">Race ${season.race+1}: ${next} GP</button><button class="btn" id="all">Sim rest of season</button>
   <span class="sp"></span><b>Race ${season.race} / 24</b></div>
  <div id="last"></div>
  <div class="panel"><h2>Drivers' standings</h2><table><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Pts</th><th>Wins</th><th>Podiums</th></tr>
   ${rk.map((d,i)=>`<tr class="${d.me?"me":""}"><td>${i+1}</td><td>${d.name}${d.me?" ★":""}</td><td>${dot(d.team)}${d.team}</td><td>${d.pts}</td><td>${d.wins}</td><td>${d.pod}</td></tr>`).join("")}</table></div>`;
  $("#next").onclick=()=>{runRace();season.race>=24?(view="summary"):0;render()};
  document.querySelectorAll("[data-lead]").forEach(b=>b.onclick=()=>{season.lead=b.dataset.lead;render()});
  $("#all").onclick=()=>{while(season.race<24)runRace();view="summary";render()};
  if(lastRace){const r=lastRace;
    $("#last").innerHTML=`<div class="panel"><div class="role">${r.wet?"Wet":"Dry"} · Round ${r.n}</div><h2>${r.name} GP result</h2><table><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Pts</th></tr>
    ${r.grid.map(g=>`<tr class="${g.d.me?"me":""} ${g.dnf?"dnf":""}"><td>${g.dnf?"DNF":g.pos}</td><td>${g.d.name}${g.d.me?" ★":""}</td><td>${dot(g.d.team)}${g.d.team}</td><td>${g.pts}</td></tr>`).join("")}</table></div>`}
}

function renderSummary(){
  const rk=ranked(),top=rk.slice(0,3),mine=rk.filter(d=>d.me);
  const con=Object.entries(season.teams).sort((a,b)=>b[1]-a[1]);
  const myCon=con.findIndex(c=>c[0]==="Your Team")+1;
  const most=(k)=>[...season.drivers].sort((a,b)=>b[k]-a[k])[0];
  const ord=n=>["1st","2nd","3rd"][n];
  const mine2=mine.map(d=>`${d.name} P${rk.indexOf(d)+1} (${d.pts} pts, ${d.wins} wins, ${d.pod} podiums)`).join(" · ");
  const tw=mine.reduce((a,d)=>a+d.wins,0),tp=mine.reduce((a,d)=>a+d.pod,0);
  const label=rk[0].me&&con[0][0]==="Your Team"?"DOUBLE CHAMPIONS":rk[0].me?"WORLD CHAMPION":con[0][0]==="Your Team"?"CONSTRUCTORS’ CHAMPIONS":"";
  $("#app").innerHTML=`
  <div class="center" style="padding-bottom:10px"><div class="role">2026 season complete</div><h2 style="font-size:34px">${top[0].name} is World Champion</h2></div>
  <div class="podium">${[1,0,2].map(i=>`<div class="pod p${i+1}" style="--c:${COL[top[i].team]}"><div class="big">${i+1}</div><div class="nm">${top[i].name}${top[i].me?" ★":""}</div><div class="sub">${top[i].team}</div>
   <b>${top[i].pts} pts</b><div class="sub">${top[i].wins} wins · ${top[i].pod} podiums</div></div>`).join("")}</div>
  <div class="panel"><h2>Your team: ${myCon===1?"Constructors' Champions!":"P"+myCon+" in the constructors' standings"}</h2>
   <p>${mine2}</p><p style="color:var(--mut);margin-top:6px">Combined: ${tw} win${tw===1?"":"s"}, ${tp} podium${tp===1?"":"s"}, ${season.teams["Your Team"]} constructor points.</p></div>
  <details class="panel"><summary>Your squad · Team Power ${power().total}</summary>
   <div class="grid">${Object.keys(LIMIT).flatMap(r=>picks(r)).map(i=>card(i)).join("")}</div>
   <p style="color:var(--mut);margin-top:12px;font-size:13px">Drivers ${power().avg.toFixed(1)} avg · Car ${power().c} · Principal ${power().p} · Engineer ${power().e}. #1 driver: ${season.lead}.</p></details>
  <div class="panel"><h2>Season awards</h2><p>Most wins: <b>${most("wins").name}</b> (${most("wins").wins}) · Most podiums: <b>${most("pod").name}</b> (${most("pod").pod}) · Most DNFs: <b>${most("dnf").name}</b> (${most("dnf").dnf})</p></div>
  <div class="two">
   <div class="panel"><h2>Drivers' championship</h2><table><tr><th>Pos</th><th>Driver</th><th>Pts</th><th>Wins</th><th>Pod</th><th>Best</th><th>DNF</th></tr>
    ${rk.map((d,i)=>`<tr class="${d.me?"me":""}"><td>${i+1}</td><td>${dot(d.team)}${d.name}${d.me?" ★":""}</td><td>${d.pts}</td><td>${d.wins}</td><td>${d.pod}</td><td>P${d.best>50?"-":d.best}</td><td>${d.dnf}</td></tr>`).join("")}</table></div>
   <div><div class="panel"><h2>Constructors' championship</h2><table><tr><th>Pos</th><th>Team</th><th>Pts</th></tr>
    ${con.map((c,i)=>`<tr class="${c[0]==="Your Team"?"me":""}"><td>${i+1}</td><td>${dot(c[0])}${c[0]}</td><td>${c[1]}</td></tr>`).join("")}</table></div>
   <div class="panel"><h2>Race winners</h2><table>${season.winners.map((w,i)=>`<tr class="${w.win.me?"me":""}"><td>R${i+1}</td><td>${w.name}${w.wet?" (wet)":""}</td><td>${w.win.name}</td></tr>`).join("")}</table></div></div></div>
  <div class="center">${label?`<button class="btn big" id="replay" style="margin-right:12px">Replay celebration</button>`:""}<button class="btn red big" id="again">Draft a new team</button></div>`;
  $("#again").onclick=reset;
  if(label){$("#replay").onclick=()=>celebrate(label);celebrate(label)}
}

// ---------- CELEBRATION: confetti + top-down car doing donuts ----------
let celeb=null;
const CAR_SVG=`<svg class="car" viewBox="0 0 120 50" width="120" height="50"><rect x="2" y="4" width="9" height="42" rx="2" fill="#111"/>
<rect x="14" y="0" width="22" height="11" rx="3" fill="#111"/><rect x="14" y="39" width="22" height="11" rx="3" fill="#111"/>
<rect x="80" y="2" width="16" height="9" rx="3" fill="#111"/><rect x="80" y="39" width="16" height="9" rx="3" fill="#111"/>
<path d="M8 21L38 17L66 20L110 23V27L66 30L38 33L8 29Z" fill="#e10600"/><rect x="28" y="13" width="36" height="24" rx="9" fill="#c40500"/>
<rect x="10" y="24" width="96" height="2" fill="#fff"/><rect x="104" y="7" width="10" height="36" rx="2" fill="#f4f4f6"/>
<circle cx="52" cy="25" r="5.5" fill="#111"/><circle cx="52" cy="25" r="3" fill="#f5c542"/></svg>`;
function celebrate(label){
  if(celeb)celeb.stop();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const W=innerWidth,H=innerHeight,root=document.createElement("div");
  root.id="celeb";
  root.innerHTML=`<canvas></canvas>${CAR_SVG}<canvas></canvas><div class="cbanner">${label}</div>`;
  document.body.appendChild(root);
  const [tr,cf]=root.querySelectorAll("canvas"),car=root.querySelector(".car");
  tr.width=cf.width=W;tr.height=cf.height=H;
  const tc=tr.getContext("2d"),cc=cf.getContext("2d");
  const cx=W/2,R=Math.min(95,W/6,H/5),cy=H*.5,yb=cy+R,T1=1.6,T2=3.6,T3=1.6,TOT=T1+T2+T3;
  const cols=["#e10600","#ffffff","#f5c542","#27f4d2","#3671c6","#ff8000"];
  const mk=y=>({x:Math.random()*W,y,w:6+Math.random()*6,h:3+Math.random()*5,vy:120+Math.random()*160,sw:Math.random()*2,ph:Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*8,c:cols[Math.floor(Math.random()*cols.length)]});
  const conf=Array.from({length:170},()=>mk(-Math.random()*H)),smoke=[];
  let start=null,last=0,prev=null,raf,ended=false;
  function frame(ts){
    if(start===null){start=ts;last=ts}
    const t=(ts-start)/1000,dt=Math.min(.05,(ts-last)/1000);last=ts;
    let x,y,deg=0,donut=false;
    if(t<T1){x=-140+(cx+140)*(t/T1);y=yb}
    else if(t<T1+T2){donut=true;const u=(t-T1)/T2,phi=u*Math.PI*6;x=cx+R*Math.sin(phi);y=cy+R*Math.cos(phi);deg=-phi*180/Math.PI-28*Math.min(1,u*8,(1-u)*8)}
    else{const u=Math.min(1,(t-T1-T2)/T3);x=cx+(W+140-cx)*u;y=yb}
    car.style.transform=`translate(${x-60}px,${y-25}px) rotate(${deg}deg)`;
    if(donut){
      const a=deg*Math.PI/180,rx=x-Math.cos(a)*34,ry=y-Math.sin(a)*34,nx=-Math.sin(a)*13,ny=Math.cos(a)*13;
      if(prev){tc.strokeStyle="rgba(10,10,10,.55)";tc.lineWidth=5;tc.lineCap="round";
        for(const k of[1,-1]){tc.beginPath();tc.moveTo(prev.x+nx*k,prev.y+ny*k);tc.lineTo(rx+nx*k,ry+ny*k);tc.stroke()}}
      prev={x:rx,y:ry};smoke.push({x:rx,y:ry,r:5,a:.45},{x:rx+nx,y:ry+ny,r:4,a:.4});
    } else prev=null;
    cc.clearRect(0,0,W,H);
    for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.r+=dt*32;p.a-=dt*.45;
      if(p.a<=0){smoke.splice(i,1);continue}
      cc.fillStyle=`rgba(225,225,225,${p.a})`;cc.beginPath();cc.arc(p.x,p.y,p.r,0,6.3);cc.fill()}
    for(const p of conf){
      p.y+=p.vy*dt;p.x+=Math.sin(t*3+p.ph)*p.sw;p.rot+=p.vr*dt;
      if(p.y>H+20&&t<TOT-.5){p.y=-10;p.x=Math.random()*W}
      if(p.y>H+20)continue;
      cc.save();cc.translate(p.x,p.y);cc.rotate(p.rot);cc.fillStyle=p.c;cc.fillRect(-p.w/2,-p.h/2,p.w,p.h);cc.restore();
    }
    if(t>TOT+1.2&&!ended){ended=true;root.style.opacity=0;setTimeout(()=>{if(celeb&&celeb.root===root)celeb.stop()},1100)}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  celeb={root,stop(){cancelAnimationFrame(raf);root.remove();if(celeb&&celeb.root===root)celeb=null}};
}

function reset(){view="draft";sel=[];offer=null;refreshes=2;spinning=false;season=null;lastRace=null;render()}
function render(){if(view!=="summary"&&celeb)celeb.stop();view==="draft"?renderDraft():view==="team"?renderTeam():renderSummary();window.scrollTo(0,0)}
$("#restart").onclick=()=>{if(!season||view==="summary"||confirm("Abandon this squad and start a new draft?"))reset()};
render();
</script>
